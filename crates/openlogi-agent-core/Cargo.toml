[package]
name = "openlogi-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless orchestration shared by the OpenLogi background agent: hook runtime, HID++ writes, DPI cycle, Actions Ring session state."
# Links path-only siblings and is bundled inside the .app via openlogi-agent.
publish = false

[dependencies]
openlogi-core = { path = "../openlogi-core" }
openlogi-inject = { path = "../openlogi-inject" }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
futures-lite = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Pointer reads for the flow edge watcher. Matches the version openlogi-hook
# already pins, so the graph keeps one x11rb.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
# Only to advance virtual time in the DeviceOp/timed timeout test without a
# real multi-second sleep.
openlogi-fixture = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
